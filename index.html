<!DOCTYPE html>
<html>
<head>
    <title>The Power of Sequencing</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>The Power of Sequencing</h1>

    <p>Click a button to change the order of the story.</p>

    <div class="story">

        <div class="scene">
            <div class="placeholder" id="image1">Image 1</div>
            <p id="caption1">Student is studying.</p>
        </div>

        <div class="scene">
            <div class="placeholder" id="image2">Image 2</div>
            <p id="caption2">Student drinks coffee.</p>
        </div>

        <div class="scene">
            <div class="placeholder" id="image3">Image 3</div>
            <p id="caption3">Student falls asleep.</p>
        </div>

    </div>

    <button id="story1Button">Story 1</button>
    <button id="story2Button">Story 2</button>

    <p id="meaning">
        The student tries to stay awake but still falls asleep.
    </p>

    <script src="script.js"></script>

</body>
</html>
